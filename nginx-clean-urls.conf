# Ellipse Hotels — clean URLs + cache headers for nginx
# Add inside the server { } block for staging/production vhosts.
# Then reload: sudo nginx -t && sudo systemctl reload nginx
#
# Expected public URLs:
#   /  /about  /rooms  /room-details  /dining  /facilities  /gallery  /contact  /terms

# 301: /index.html → /
location = /index.html {
    return 301 /;
}

# 301: /page.html → /page
location ~ ^/([^/]+)\.html$ {
    return 301 /$1;
}

location ^~ /css/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /js/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000";
}

location ^~ /data/ {
    add_header Cache-Control "no-cache, must-revalidate";
}

location ^~ /api/ {
    add_header Cache-Control "no-cache, must-revalidate";
}

location / {
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
}
